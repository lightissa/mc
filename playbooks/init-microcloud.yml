---
- name: Initialize MicroCloud using Preseed
  hosts: "{{ groups['microcloud'][0] }}"
  become: yes
  tasks:
    - name: Create directory for configuration
      file:
        path: /opt/microcloud
        state: directory
        mode: '0755'

    - name: Generate the MicroCloud preseed file from template
      template:
        src: templates/microcloud-init-preseed.j2
        dest: /opt/microcloud/preseed.yaml
        mode: '0600'

    - name: Initialize MicroCloud cluster
      shell: "cat /opt/microcloud/preseed.yaml | microcloud preseed"
      # Note: This task will be "changed" on every run if no condition is set. 
      # You can limit execution if the cluster is already initialized.
      ignore_errors: yes
